[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "talend-task"
version = "0.1.21.dev0"
description = "CLI and Python API for running Talend Cloud jobs"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Corey Goldberg"}]
maintainers = [{name = "Corey Goldberg"}]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "talend",
    "talend-cloud",
    "qlik",
    "etl",
    "pipeline",
    "cli",
    "api",
    "job",
    "automation",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    # pin full runtime dependency tree
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "idna==3.20",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "Pygments==2.21.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "rich==15.0.0",
    "urllib3==2.8.0",
]

[project.scripts]
talend_task = "talend_task.cli:main"

[project.urls]
homepage = "https://github.com/cgoldberg/talend-task"
repository = "https://github.com/cgoldberg/talend-task"
documentation = "https://coreygoldberg.com/talend-task"

[dependency-groups]
build = [
    "twine==7.0.0",
]
docs = [
    "pdoc==16.0.0",
]
lint = [
    "ruff==0.17.3",
]
test = [
    "pytest==9.2.0",
]
validate = [
    "validate-pyproject[all]==0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
addopts = ["-v"]
filterwarnings = ["default"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
respect-gitignore = true
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "COM812", "D", "EM101", "EM102", "FBT",
    "PLR", "S101", "S105", "S106", "TRY003", "TRY400"
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["INP001", "SLF001"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
