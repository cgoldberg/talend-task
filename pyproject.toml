[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "talend_task"
version = "0.1.5dev0"
description = "CLI for running Talend Cloud jobs"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Corey Goldberg"}]
maintainers = [{name = "Corey Goldberg"}]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "talend",
    "talend-cloud",
    "etl",
    "pipeline",
    "cli",
    "api",
    "jobs",
    "automation",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "rich==15.0.0",
]

[project.scripts]
talend_task = "talend_task.cli:main"

[project.urls]
homepage = "https://github.com/cgoldberg/talend-task"
source = "https://github.com/cgoldberg/talend-task"
download = "https://pypi.org/project/talend-task"

[dependency-groups]
dev = [
    "tox",
]
lint = [
    "ruff",
]
test = [
    "pytest",
]
validate = [
    "packaging",
    "validate-pyproject",
    "tomli; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
addopts = ["-v"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
respect-gitignore = true
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "PT", "RUF", "TID", "W"]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-line-length = 88
docstring-code-format = true
