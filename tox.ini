# Tox configuration - environment and task orchestrator
#
# Run "tox" from this directory.
#
# Run a specific environment with:
#   "tox -e <env>" (e.g. "tox -e lint")


[tox]
envlist =
    validate
    lint
    py310
    py315
skip_missing_interpreters = true


[testenv]
description = run tests
passenv = *
dependency_groups =
    test
commands =
    pytest {tty:--color=yes} {posargs:.}


[testenv:validate]
description = validate project configuration and packaging
dependency_groups =
    validate
commands =
    validate-pyproject pyproject.toml
    talend_task -h


[testenv:lint]
description = run linter and formatter
package = skip
dependency_groups =
    lint
commands =
    ruff check --fix --show-fixes --exit-non-zero-on-fix .
    ruff format --exit-non-zero-on-format .


[testenv:docs]
description = build docs
platform = .*
allowlist_externals =
    echo
dependency_groups =
    docs
commands =
    echo "Cleaning {tox_root}/build/"
    {envpython} -c "import shutil; shutil.rmtree('build', ignore_errors=True)"
    echo "Building docs..."
    {envpython} -m pdoc talend_task.talend_client \
        --output-dir build/docs \
        --template-directory docs/pdoc \
        --no-search \
        --docformat markdown
    echo "Docs successfully built: {tox_root}/build/docs/index.html"
