# Tox (https://tox.wiki/) configuration file.
# To use it, run "tox" from this directory.
#
# For a specific environment, run:
#     "tox -e <env>" (i.e.: "tox -e py314" or "tox -e lint")


[tox]
envlist =
    validate
    lint
    py310
    py311
    py312
    py313
    py314
skip_missing_interpreters = true


[testenv:validate]
description = validate project configuration and packaging
dependency_groups =
    validate
commands =
    validate-pyproject pyproject.toml
    talend_task -h


[testenv:lint]
description = run linter and formatter
skip_install = true
dependency_groups =
    lint
commands =
    # run linting
    ruff check --fix --show-fixes --exit-non-zero-on-fix .
    # run formatting
    ruff format --exit-non-zero-on-format .


[testenv:docs]
description = build API docs and view in browser
dependency_groups =
    docs
commands =
    pdoc talend_task.talend_client \
        --no-search \
        --docformat markdown \
        --footer-text "github.com/cgoldberg/talend-task"


[testenv]
description = run tests
passenv = *
dependency_groups =
    test
commands =
    pytest {tty:--color=yes} {posargs:.}
