
name: "Testing"

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            toxenv: py310
          - python-version: "3.11"
            toxenv: py311
          - python-version: "3.12"
            toxenv: py312
          - python-version: "3.13"
            toxenv: py313
          - python-version: "3.14"
            toxenv: py314
    steps:
      - uses: actions/checkout@v6
      - name: set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install dependencies
        run: |
          pip install tox
      - name: Validate project configuration
        run: |
          tox
        env:
          TOXENV: validate
      - name: Run linter and formatter
        run: |
          tox
        env:
          TOXENV: lint
      - name: Run tests
        run: |
          tox
        env:
          TOXENV: ${{ matrix.toxenv }}
